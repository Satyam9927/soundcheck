# Human-confirmed intent. Soundcheck verifies the request.source value supplied
# by its Kong model; the deployment must separately ensure Kong derives that
# value from trusted proxy / real-IP configuration that clients cannot spoof.
schema_version: 1
kind: network-restricted-access
scope:
  path_prefix: /internal
  method: GET
  host: internal.example
  trusted_cidr: 10.0.0.0/8
assumptions:
  source_ip_integrity: externally-enforced
